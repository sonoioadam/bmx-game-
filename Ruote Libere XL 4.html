<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruote Libere XL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: canvas 3D a tutta pagina; pannello garage/spot a sinistra (sotto su telefono); HUD in sovrimpressione. */
:root{
  color-scheme:dark;
  --bg:#0c1530;--panel:rgba(18,30,66,.94);--panel2:#243a78;--line:#3a52a0;
  --ink:#f3f5ff;--mute:#a9b8ea;--accent:#ffd23f;--hot:#ff4f81;--ok:#46e0a0;--cool:#3fa7ff;
  --f-disp:'Bungee','Impact','Arial Black',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center}
#loading h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,9vw,64px);margin:0 0 10px}
#loading h1 span{color:var(--accent)}
#loading .bar{width:min(320px,70vw);height:10px;border-radius:5px;background:#16234a;overflow:hidden;margin:12px auto 0}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#menu{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(430px,100%);display:none;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:var(--panel);border-right:2px solid var(--line);overflow-y:auto;gap:14px}
#menu.on{display:flex}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:38px;line-height:.95;margin:0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--mute);font-size:15px}
.tape{height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#111a38 12px 24px);margin-top:10px}
h2{font-family:var(--f-cond);font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
.vehicles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.veh{background:#16234a;border:2px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.02em;min-width:0;text-transform:uppercase}
.veh small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--mute);line-height:1.2;margin-top:2px}
.veh[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.row>.lb{font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--mute)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{background:#0c1530;border:2px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#111a38;border-color:var(--accent)}
.stats{display:grid;gap:5px;font-size:12.5px;color:var(--mute);margin-top:4px}
.stat{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center}
.bar{height:7px;border-radius:4px;background:#0c1530;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spot{background:#16234a;border:2px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.spot b{font-family:var(--f-cond);font-size:18px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.spot b i{width:11px;height:11px;border-radius:3px;flex:none}
.spot small{color:var(--mute);font-size:12px;line-height:1.2}
.spot[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.go{flex:1;font-family:var(--f-disp);font-size:24px;background:var(--hot);color:#fff;border:0;border-radius:12px;padding:14px 16px;box-shadow:0 5px 0 #a8284f;min-width:130px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8284f}
.go.sec{background:var(--panel2);box-shadow:0 5px 0 #162455;font-size:19px}
details.help{background:#16234a;border:2px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute);font-size:14px}
details.help summary{cursor:pointer;font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
details.help table{border-collapse:collapse;width:100%;margin-top:6px}
details.help td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
details.help td:first-child{white-space:nowrap;color:var(--accent);font-weight:700;padding-right:8px}

.tabs{display:flex;gap:5px;flex-wrap:wrap;position:sticky;top:-14px;background:var(--panel);padding:6px 0;z-index:2}
.tabs button{flex:1;min-width:0;white-space:nowrap;background:#16234a;border:2px solid var(--line);border-radius:9px;padding:6px 4px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#111a38;border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{background:#16234a;border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--panel2);border-color:var(--accent)}
.mcard{background:#16234a;border:2px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;text-align:left;display:block;width:100%}
.mcard[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.mcard .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-family:var(--f-cond);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.mcard .p{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.mcard .p.own{color:var(--ok)}
.mcard .d{color:var(--mute);font-size:13px;line-height:1.25;margin:2px 0 4px}
.mcard .loc{font-size:12px;color:var(--cool)}
.bank{display:flex;justify-content:space-between;align-items:center;background:#0c1530;border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-family:var(--f-cond);font-weight:700;font-size:19px;letter-spacing:.05em}
.bank b{color:var(--accent);font-variant-numeric:tabular-nums}
.sec2{margin:2px 0 10px}
.msg{min-height:1.3em;font-size:14px;color:var(--ok)}.msg.bad{color:var(--hot)}
.pbtn{background:var(--accent);color:#111a38;border:0;border-radius:9px;padding:7px 14px;font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.pbtn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.pbtn.hot{background:var(--hot);color:#fff}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.inp{width:100%;background:#0c1530;color:var(--ink);border:2px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:18px;letter-spacing:.1em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.rng{width:100%;accent-color:var(--accent)}
.modeb{display:grid;gap:10px}
.modeb button{text-align:left;border:2px solid var(--line);background:#16234a;border-radius:12px;padding:12px 14px}
.modeb b{display:block;font-family:var(--f-disp);font-weight:400;font-size:26px}
.modeb small{color:var(--mute);font-size:13.5px}
.modeb button:hover{border-color:var(--accent)}
.hmoney{font-family:var(--f-disp);font-size:clamp(16px,3.4vw,24px);color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:5px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:3px;color:#fff}
.prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(13,22,48,.88);border:2px solid var(--accent);border-radius:10px;padding:7px 14px;font-family:var(--f-cond);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:none;pointer-events:auto}
.prompt kbd{background:var(--accent);color:#111a38;border-radius:5px;padding:1px 7px;margin-right:7px;font-family:var(--f-disp)}
.qcard{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(132px + env(safe-area-inset-top,0px));max-width:220px;background:rgba(13,22,48,.78);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;display:none}
.qcard b{display:block;font-family:var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-size:14px}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;width:min(560px,94%);background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;display:none}
#dlg.on{display:block}
#rep{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;width:min(620px,94%);display:none;background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:10px 12px;gap:8px;align-items:center;flex-wrap:wrap}
#rep.on{display:flex}
#rep .rt{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:14px;width:100%}
#rep button{font:inherit;font-weight:700;min-width:46px;height:42px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:inherit;cursor:pointer;padding:0 10px}
#rep button:hover,#rep button:focus-visible{background:rgba(255,255,255,.12);outline:none}
#rep input[type=range]{flex:1;min-width:140px;height:42px;accent-color:#ffd23f}
#rep .rtm{font-variant-numeric:tabular-nums;font-size:13px;min-width:78px;text-align:right}

#bp{position:fixed;inset:0;z-index:23;display:none;align-items:center;justify-content:center;background:rgba(6,10,24,.72);backdrop-filter:blur(3px);padding:12px}
#bp.on{display:flex}
#bp .tk{width:min(640px,100%);display:flex;background:#f6f1e4;color:#17203a;border-radius:16px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.6);font-family:var(--f-cond,system-ui)}
@keyframes bpIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
#bp .mn{flex:1;padding:16px 18px;min-width:0}
#bp .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #b9b19a;padding-bottom:8px;margin-bottom:10px}
#bp .hd b{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#1c3f94}
#bp .hd span{font-size:13px;letter-spacing:.12em;color:#6b6652}
#bp .fl{font-size:13px;color:#6b6652;letter-spacing:.08em;margin:0 0 8px}
#bp .ds{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid #1c3f94;border-radius:12px;padding:10px 12px;margin:7px 0;cursor:pointer;color:#17203a;transition:transform .12s,background .12s}
#bp .ds:hover,#bp .ds:focus-visible{background:#e8efff;transform:translateX(4px);outline:none}
#bp .ds .fg{font-size:34px;line-height:1}
#bp .ds .nm{font-size:19px;font-weight:700}
#bp .ds .sb{font-size:13px;color:#5a5a6a}
#bp .ds .cd{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:.1em;color:#1c3f94}
#bp .ds.no{border-color:#9a9a9a;color:#444}
#bp .st{width:112px;border-left:2px dashed #b9b19a;padding:14px 10px;background:#ece5d1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;font-size:12px;color:#6b6652;letter-spacing:.08em}
#bp .st .bc{width:86px;height:64px;background:repeating-linear-gradient(90deg,#17203a 0 2px,transparent 2px 4px,#17203a 4px 5px,transparent 5px 8px,#17203a 8px 11px,transparent 11px 12px)}
#bp .st .pl{font-size:34px}
@media(max-width:520px){#bp .st{display:none}}

#dlg .who{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:16px}
#dlg .txt{font-size:16.5px;margin:4px 0 8px}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:24;background:rgba(13,22,48,.92);border:2px solid var(--ok);border-radius:10px;padding:8px 16px;font-family:var(--f-cond);font-weight:700;font-size:19px;letter-spacing:.05em;opacity:0;pointer-events:none;transition:opacity .3s;max-width:92%;text-align:center}
#toast.on{opacity:1}#toast.bad{border-color:var(--hot)}
#fade{position:fixed;inset:0;z-index:21;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
.tag.poi{border-color:var(--cool);font-size:13px}

@media (max-width:720px){
  #menu{top:auto;width:100%;height:60%;border-right:0;border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .row{grid-template-columns:minmax(0,1fr)}
}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
.hs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));font-family:var(--f-disp);font-size:clamp(24px,5.4vw,38px);text-shadow:0 0 6px rgba(0,0,0,.7),0 3px 0 rgba(0,0,0,.45);line-height:1;font-variant-numeric:tabular-nums}
.hs small{display:block;font-family:var(--f-cond);font-size:13px;letter-spacing:.16em;color:var(--accent);text-shadow:none;margin-bottom:2px}
.hmid{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));text-align:center;width:min(60vw,520px)}
.combo{font-family:var(--f-cond);font-weight:700;font-size:clamp(18px,3.6vw,28px);text-shadow:0 2px 0 rgba(0,0,0,.6);min-height:1.2em}
.combo b{color:var(--accent)}
.flash{font-family:var(--f-disp);font-size:clamp(24px,6vw,44px);color:var(--ok);text-shadow:0 3px 0 rgba(0,0,0,.5);opacity:0;margin-top:4px}
.flash.show{animation:fl 1.4s ease-out forwards}.flash.bad{color:var(--hot)}
@keyframes fl{0%{opacity:0;transform:translateY(12px) scale(.85)}12%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.zone{display:none;font-family:var(--f-cond);font-weight:700;font-size:clamp(16px,3vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:2px}
.hr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:150px;height:150px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:#1a2a55;display:block}
.ibtns{display:flex;gap:6px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,255,255,.45);background:rgba(13,22,48,.65);display:grid;place-items:center;font-size:17px;padding:0}
.spd{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));width:150px;display:grid;gap:5px}
.m{height:8px;border-radius:4px;background:rgba(13,22,48,.7);overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.m i{display:block;height:100%;width:0;background:var(--cool)}
#spdn{font-family:var(--f-cond);font-weight:700;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#batt{display:none}#batt i{background:var(--ok)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(13,22,48,.78);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;text-align:center;max-width:92%;transition:opacity .6s}
.tag{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;background:rgba(13,22,48,.8);border:2px solid var(--accent);border-radius:8px;padding:2px 8px;white-space:nowrap;display:none}
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
#touch.on{display:block}
body.padOn #touch,body.padOn #touch.on{display:none!important}
.joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(13,22,48,.35);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(13,22,48,.55);color:#fff;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;padding:0;display:grid;place-items:center;text-align:center}
.tb.act{background:rgba(255,210,63,.85);color:#111a38}
#ov{position:fixed;inset:0;z-index:25;background:rgba(8,12,28,.7);display:none;place-items:center}
#ov.on{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:240px;max-width:90%;text-align:center}
.card h3{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:0}
.card button{font-family:var(--f-cond);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#111a38;border:0;border-radius:10px;padding:12px 18px}
.card button.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}

.online{white-space:nowrap;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--ok);text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:3px;display:none}
.chat{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(340px,62vw);display:none;flex-direction:column;gap:5px;pointer-events:none}
.chat.on{display:flex}
#chatlog div{background:rgba(13,22,48,.72);border-radius:8px;padding:3px 8px;font-size:14px;margin-top:2px;word-break:break-word;transition:opacity .6s}
#chatlog b{color:var(--accent)}#chatlog i{color:var(--mute);font-style:normal}
.chatin{display:none;pointer-events:auto;flex-direction:column;gap:5px}.chatin.on{display:flex}

   q.onsuccess=()=>{db=q.result;res(true);};q.onerror=()=>{dbOk=false;res(false);};}catch(e){dbOk=false;res(false);}});}

const M4_=()=>M4;
function drawVeh(o,B,sp,S_){
  if(!o.faces||!o.faces.length){try{prep(o);}catch(e){o.faces=[];window.__phErr=String(e&&e.stack||e);console.error('Photo.prep',e);return;}}
  if(!o.faces.length)return;
  window.__phDraw=(window.__phDraw||0)+1;
  const mul=M4.mul,T=M4.T,S=M4.S;
  if(!GL3.texBegin())return;
  const scale=sp.wb/o.faces[0].dist,spin=S_.wheel||0,tintDark=[.55,.55,.58];
  let bodyH=0;
  for(const f of o.faces){
    const s=f.s,sc=sp.wb/f.dist,zc=(s.w/2-f.xm)*(-f.sg)*sc,yc=(f.ground-s.h/2)*sc,x=f.sg*.035;
    const Rm=M4.RY(f.sg*Math.PI/2);
    GL3.texDraw(f.tex,mul(B,mul(T(x,yc,zc),mul(Rm,S(s.w*sc,s.h*sc,1)))));
    bodyH=Math.max(bodyH,s.h*sc);
    for(const w of f.wt){
      const q=w.q,wz=(q.cx-f.xm)*(-f.sg)*sc,wy=(f.ground-q.cy)*sc,a=f.sg>0?spin:-spin;
      GL3.texDraw(w.tex,mul(B,mul(T(x+f.sg*.006,wy,wz),mul(Rm,mul(M4.RZ(a),S(q.r*2*sc,q.r*2*sc,1))))));
    }
  }
  // riempimento centrale per non vedere il vuoto di lato/obliquo
  const f0=o.faces[0],s0=f0.s,sc0=scale;
  GL3.texDraw(f0.tex,mul(B,mul(T(0,(f0.ground-s0.h/2)*sc0,(s0.w/2-f0.xm)*(-f0.sg)*sc0),mul(M4.RY(Math.PI/2),S(s0.w*sc0,s0.h*sc0,1)))),tintDark);
  if(o.front){
    const fr=o.front,k=bodyH*.9/fr.h;
    GL3.texDraw(fr.tex,mul(B,mul(T(0,fr.h*k/2,0),S(fr.w*k,fr.h*k,1))),[.85,.85,.88]);
  }else{ // senza foto frontale: sezioni sottili (corpo schiacciato + gomme viste di fronte) cosi' il mezzo non sparisce da davanti/dietro
    const f=o.faces[0],sc=sp.wb/f.dist;
    GL3.texDraw(f.tex,mul(B,mul(T(0,(f.ground-f.s.h/2)*sc,(f.s.w/2-f.xm)*(-f.sg)*sc),S(.11,f.s.h*sc,1))),[.8,.8,.82]);
    for(const w of f.wt){const q=w.q;GL3.texDraw(w.tex,mul(B,mul(T(0,(f.ground-q.cy)*sc,(q.cx-f.xm)*(-f.sg)*sc),S(.07,q.r*2*sc,1))),[.5,.5,.5]);}
  }
  GL3.texEnd();
}

/* ---------- ritaglio sfondo ---------- */
function fitCanvas(src,max){
  const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.max(8,Math.round(w0*k));c.height=Math.max(8,Math.round(h0*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;
}
function autoMask(img,tol){
  const w=img.width,h=img.height,d=img.data,n=w*h,m=new Uint8Array(n).fill(1);
  // riferimenti: colore medio dei 4 bordi
  const refs=[];const avg=(pts)=>{let r=0,g=0,b=0;for(const p of pts){r+=d[p*4];g+=d[p*4+1];b+=d[p*4+2];}return[r/pts.length,g/pts.length,b/pts.length];};
  const T_=[],B_=[],L_=[],R_=[];for(let x=0;x<w;x++){for(let k=0;k<3;k++){T_.push(k*w+x);B_.push((h-1-k)*w+x);}}
  for(let y=0;y<h;y++){for(let k=0;k<3;k++){L_.push(y*w+k);R_.push(y*w+w-1-k);}}
  refs.push(avg(T_),avg(B_),avg(L_),avg(R_));
  const t2=tol*tol*3;
  const isBg=p=>{const r=d[p*4],g=d[p*4+1],b=d[p*4+2];for(const q of refs){const dr=r-q[0],dg=g-q[1],db_=b-q[2];if(dr*dr+dg*dg+db_*db_<t2)return true;}return false;};
  const seen=new Uint8Array(n),st=[];
  const push=p=>{if(!seen[p]){seen[p]=1;if(isBg(p)){m[p]=0;st.push(p);}}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;if(x>0)push(p-1);if(x<w-1)push(p+1);if(y>0)push(p-w);if(y<h-1)push(p+w);}
  return m;
}
function erode(m,w,h){const o=new Uint8Array(m);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(m[p]&&(!m[p-1]||!m[p+1]||!m[p-w]||!m[p+w]))o[p]=0;}return o;}
function applyMask(orig,mask){const c=document.createElement('canvas');c.width=orig.width;c.height=orig.height;const x=c.getContext('2d'),id=x.createImageData(orig.width,orig.height);
  for(let i=0;i<mask.length;i++){id.data[i*4]=orig.data[i*4];id.data[i*4+1]=orig.data[i*4+1];id.data[i*4+2]=orig.data[i*4+2];id.data[i*4+3]=mask[i]?255:0;}
  x.putImageData(id,0,0);return c;}
function bbox(mask,w,h){let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(mask[y*w+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  return x1<0?null:{x0,y0,x1:x1+1,y1:y1+1};}

function wizard(onDone){
  const W={cls:'bmx',name:'',items:[]}; // items: {orig:ImageData,cv,type,mask,fdir,wheels,tol}
  const m=shell();
  m.appendChild(el('h2',null,'1 · Le foto'));
  m.appendChild(el('p',null,'Scatta o scegli più foto: almeno una di lato (mezzo intero, ruote visibili). Puoi aggiungere altri lati e una frontale. Meglio sfondo uniforme e mezzo in piedi.'));

  const r1=el('div','row');r1.appendChild(nm);r1.appendChild(sel);m.appendChild(r1);
  const fi=el('input');fi.type='file';fi.accept='image/*';fi.multiple=true;fi.style.cssText='color:#a9b3cc';
  const r2=el('div','row');r2.appendChild(fi);m.appendChild(r2);
  const th=el('div','thumbs');m.appendChild(th);
  const note=el('p',null,'');m.appendChild(note);
  function redraw(){
    th.innerHTML='';W.items.forEach((it,i)=>{
      const d=el('div','th');const im=el('img');im.src=it.cv.toDataURL('image/jpeg',.6);d.appendChild(im);
      const row=el('div','row');row.style.margin='4px 0 0';
      const sd=btn('Lato',it.type==='side'?'on':'',()=>{it.type='side';redraw();}),fr=btn('Fronte',it.type==='front'?'on':'',()=>{it.type='front';redraw();});
      sd.style.padding=fr.style.padding='4px 8px';row.appendChild(sd);row.appendChild(fr);
      row.appendChild(btn('✕','x',()=>{W.items.splice(i,1);redraw();}));d.appendChild(row);th.appendChild(d);});
  }
  fi.onchange=async()=>{
    for(const f of fi.files){
      try{const bm=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));const cv=fitCanvas(bm,640);
        W.items.push({cv,type:W.items.some(x=>x.type==='side')?'front':'side'});}catch(e){note.textContent='Foto non leggibile.';}
    }
    fi.value='';redraw();
  };
  const r3=el('div','row');
  r3.appendChild(btn('Avanti →','go',()=>{
    if(!W.items.some(x=>x.type==='side')){note.textContent='Serve almeno una foto di lato.';return;}
    W.cls=sel.value;W.name=(nm.value||'Il mio mezzo').trim();
    W.items=W.items.filter(x=>x.type==='side').slice(0,2).concat(W.items.filter(x=>x.type==='front').slice(0,1));
    W.items.forEach(it=>{const c=it.cv.getContext('2d');it.orig=c.getImageData(0,0,it.cv.width,it.cv.height);it.tol=40;it.mask=erode(autoMask(it.orig,it.tol),it.cv.width,it.cv.height);it.fdir=-1;it.wheels=[];});
    step(0);
  }));
  r3.appendChild(btn('Annulla','',()=>home(onDone)));m.appendChild(r3);

  function step(i){
    if(i>=W.items.length)return finish();
    const it=W.items[i],m=shell(),side=it.type==='side';
    m.appendChild(el('h2',null,'2 · Ritaglia '+(side?'(lato)':'(fronte)')+' — foto '+(i+1)+' di '+W.items.length));
    m.appendChild(el('p',null,'Lo sfondo viene tolto da solo. Regola la sensibilità, poi usa Gomma/Ripristina col dito per rifinire.'+(side?' Poi indica le due ruote trascinando dal centro al bordo.':'')));
    const cv=el('canvas','ed');cv.width=it.cv.width;cv.height=it.cv.height;m.appendChild(cv);
    const x=cv.getContext('2d');
    let mode='erase',br=18,cut;
    const paint=()=>{cut=applyMask(it.orig,it.mask);x.clearRect(0,0,cv.width,cv.height);x.drawImage(cut,0,0);
      if(side){for(const q of it.wheels){x.strokeStyle='#ffd23f';x.lineWidth=3;x.beginPath();x.arc(q.cx,q.cy,q.r,0,TAU);x.stroke();x.beginPath();x.arc(q.cx,q.cy,3,0,TAU);x.fillStyle='#ffd23f';x.fill();}}};
    paint();
    const rr=el('div','row');
    const tol=el('input');tol.type='range';tol.min=8;tol.max=120;tol.value=it.tol;
    tol.oninput=()=>{it.tol=+tol.value;it.mask=erode(autoMask(it.orig,it.tol),cv.width,cv.height);paint();};
    rr.appendChild(el('span',null,'Sensibilità'));rr.appendChild(tol);m.appendChild(rr);
    const mb=el('div','row');const modes={};
    const sm=(k)=>{mode=k;for(const kk in modes)modes[kk].className=kk===k?'on':'';};
    for(const [k,l] of[['erase','Gomma'],['keep','Ripristina']].concat(side?[['wheel','Ruote']]:[])){modes[k]=btn(l,k===mode?'on':'',()=>sm(k));mb.appendChild(modes[k]);}
    const bs=el('input');bs.type='range';bs.min=6;bs.max=50;bs.value=br;bs.oninput=()=>br=+bs.value;mb.appendChild(el('span',null,'Pennello'));mb.appendChild(bs);m.appendChild(mb);
    if(side){
      const fr=el('div','row');fr.appendChild(el('span',null,'Davanti del mezzo verso:'));
      const bl=btn('← sinistra',it.fdir<0?'on':'',()=>{it.fdir=-1;bl.className='on';brr.className='';}),brr=btn('destra →',it.fdir>0?'on':'',()=>{it.fdir=1;brr.className='on';bl.className='';});
      fr.appendChild(bl);fr.appendChild(brr);fr.appendChild(btn('Cancella ruote','',()=>{it.wheels=[];paint();}));m.appendChild(fr);
      sm('erase');
    }
    const msg=el('p',null,'');m.appendChild(msg);
    // gesti
    const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height];};
    let down=false,w0=null;
    const stroke=(px,py)=>{const v=mode==='keep'?1:0,r=br,w=cv.width,h=cv.height;
      for(let yy=Math.max(0,py-r|0);yy<Math.min(h,py+r);yy++)for(let xx=Math.max(0,px-r|0);xx<Math.min(w,px+r);xx++){const dx=xx-px,dy=yy-py;if(dx*dx+dy*dy<=r*r)it.mask[yy*w+xx]=v;}};
    cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);down=true;const[px,py]=pt(e);
      if(mode==='wheel'){if(it.wheels.length>=2)it.wheels=[];w0={cx:px,cy:py,r:4};it.wheels.push(w0);paint();}else{stroke(px,py);paint();}};
    cv.onpointermove=e=>{if(!down)return;const[px,py]=pt(e);if(mode==='wheel'&&w0){w0.r=Math.max(4,Math.hypot(px-w0.cx,py-w0.cy));paint();}else if(mode!=='wheel'){stroke(px,py);paint();}};
    cv.onpointerup=cv.onpointercancel=()=>{down=false;w0=null;};
    const nav=el('div','row');
    nav.appendChild(btn(i<W.items.length-1?'Avanti →':'Crea il mezzo ✓','go',()=>{
      if(side&&it.wheels.length<2){msg.textContent='Indica entrambe le ruote: modalità "Ruote", trascina dal centro al bordo di ognuna.';return;}
      if(!bbox(it.mask,cv.width,cv.height)){msg.textContent='Il ritaglio è vuoto: aumenta la sensibilità o usa Ripristina.';return;}
      it.cut=cut;step(i+1);}));
    nav.appendChild(btn('Indietro','',()=>i?step(i-1):wizard(onDone)));m.appendChild(nav);
  }
  async function finish(){
    const m=shell();m.appendChild(el('h2',null,'Sto creando il mezzo…'));
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5),photos=[];
    for(const it of W.items){
      const b=bbox(it.mask,it.cv.width,it.cv.height),pad=2,x0=Math.max(0,b.x0-pad),y0=Math.max(0,b.y0-pad),x1=Math.min(it.cv.width,b.x1+pad),y1=Math.min(it.cv.height,b.y1+pad);
      const c=document.createElement('canvas');c.width=x1-x0;c.height=y1-y0;c.getContext('2d').drawImage(it.cut||applyMask(it.orig,it.mask),x0,y0,c.width,c.height,0,0,c.width,c.height);
      const p={type:it.type,png:c.toDataURL('image/png')};
      if(it.type==='side'){p.fdir=it.fdir;p.wheels=it.wheels.map(q=>({cx:q.cx-x0,cy:q.cy-y0,r:q.r}));}
      photos.push(p);
    }
    const rec={id,name:W.name,cls:W.cls,photos,created:Date.now()};
    recs[id]=rec;reg(rec);metaSave();await dbPut(rec);await buildRt(rec);
    use('photo_'+id);close();if(onDone)onDone('photo_'+id);
  }
}

/* ---------- lettura glb ---------- */
const CT={5120:Int8Array,5121:Uint8Array,5122:Int16Array,5123:Uint16Array,5125:Uint32Array,5126:Float32Array};
const NC={SCALAR:1,VEC2:2,VEC3:3,VEC4:4,MAT4:16};
const s2l=x=>Math.pow(Math.max(0,Math.min(1,x)),1/2.2); // lineare -> valori del gioco
function readAcc(j,bin,i){
  const a=j.accessors[i],bv=j.bufferViews[a.bufferView],n=NC[a.type],T=CT[a.componentType],bs=T.BYTES_PER_ELEMENT;
  const stride=bv.byteStride||n*bs,off=(bv.byteOffset||0)+(a.byteOffset||0),out=new Float32Array(a.count*n);
  const dv=new DataView(bin.buffer,bin.byteOffset,bin.byteLength);
  const get=a.componentType===5126?(o)=>dv.getFloat32(o,true):a.componentType===5125?(o)=>dv.getUint32(o,true):a.componentType===5123?(o)=>dv.getUint16(o,true):a.componentType===5122?(o)=>dv.getInt16(o,true):a.componentType===5121?(o)=>dv.getUint8(o):(o)=>dv.getInt8(o);
  const nz=a.normalized?(a.componentType===5121?255:a.componentType===5123?65535:a.componentType===5120?127:32767):1;
  for(let k=0;k<a.count;k++)for(let c=0;c<n;c++)out[k*n+c]=get(off+k*stride+c*bs)/nz;
  return out;
}
function mulM(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o;}
function trsM(n){

        const corners=[[w,h,0],[-w,h,Math.PI/2],[-w,-h,Math.PI],[w,-h,Math.PI*1.5]];
        for(const[ox,oz,a0]of corners)for(let i=0;i<=6;i++){const a=a0+i*(Math.PI/2)/6;pts.push([c.cx+ox+Math.cos(a)*c.r,c.cz+oz+Math.sin(a)*c.r]);}
        for(let i=0;i<pts.length;i++)seg(pts[i],pts[(i+1)%pts.length]);
      }else{
        const a=c.lat-(c.lw-2.5),b=c.lat+(c.lw-2.5);if(b-a<2)continue;
        const n=Math.max(1,Math.ceil((b-a)/8));

function settle(S,ev,bad){

/* AIR: altezza del salto sopra il punto piu' alto tra stacco e atterraggio; punti = altezza + tempo in aria, entra nella combo */
const AIRN=[[4,'Monster Air'],[2.8,'Mega Air'],[1.7,'Big Air'],[.5,'Air']];
function airScore(S,ev,air0,fak,lateral){

}
function landGround(S,ev){S.gSteer=false;
  const T=S.V,M=S.M,air0=S.airT,dist0=Math.hypot(S.x-S.tk[0],S.z-S.tk[1]);
  S.y=W.H(S.x,S.z);

  if(W.inWater(S.x,S.z,S.y)&&!wetOk(S)){crash(S,ev,'Splash!');return;}
  if(W.bagAt&&W.bagAt(S.x,S.z)){ // AIRBAG: atterraggio sempre morbido, mai caduta
    const bsp=Math.hypot(S.vx,S.vy,S.vz);settle(S,ev);S.pitch*=.2;S.roll*=.2;S.vx*=.3;S.vz*=.3;S.vy=0;S.grounded=true;S.airT=0;S.assist=0;S.assistT=0;S.crouch=1;
    ev.push({k:'land',v:Math.min(4,bsp*.1),air:air0,dist:dist0});ev.push({k:'bag'});airScore(S,ev,air0,false,0);bank(S,ev);return;}
  const vn=-(S.vx*n[0]+S.vy*n[1]+S.vz*n[2]);
  if(S.airT<.07){
    const sp0=Math.hypot(S.vx,S.vy,S.vz);
    let ax=S.vx+n[0]*vn,ay=S.vy+n[1]*vn,az=S.vz+n[2]*vn;const al=Math.hypot(ax,ay,az)||1;
    S.vx=ax/al*sp0;S.vy=ay/al*sp0;S.vz=az/al*sp0;S.grounded=true;return;}
  const fx=Math.sin(S.yaw),fz=Math.cos(S.yaw),p=wrapPI(S.pitch),cp=Math.cos(p);
  const fdotn=cp*(fx*n[0]+fz*n[2])+Math.sin(p)*n[1];
  const dev=Math.asin(clamp(fdotn,-1,1)),tol=T.tol+M.tol+.14;
  const hs=Math.hypot(S.vx,S.vz);

function findRail(S,px,py,pz){

    const tt=((S.x-r.ax)*hx+(S.z-r.az)*hz)/L2;if(tt<0||tt>1)continue;
    const cx=r.ax+tt*hx,cz=r.az+tt*hz;if(Math.hypot(S.x-cx,S.z-cz)>.8)continue;

function startGrind(S,ev,f){
  const r=f.r,hd=Math.atan2(r.bx-r.ax,r.bz-r.az);
  const sg=S.vx*r.dx+S.vy*r.dy+S.vz*r.dz;
  const rdir=sg>=0?1:-1,diff=Math.abs(wrapPI(S.yaw-(rdir>0?hd:hd+Math.PI)));
  const bad=S.tr&&S.tr.t<S.tr.dur*.45;

  settle(S,ev);
  S.gT=0;S.rail=r;S.rt=f.tt;S.rdir=rdir;S.rs=Math.max(Math.abs(sg),4);S.grounded=false;S.airT=0;
  S.railName=r.kind==='ledge'?'Ledge Grind':r.kind==='coping'?'Coping Grind':'Rail Grind';

function endGrind(S,ev,popUp){
  const r=S.rail;S.rail=null;S.grounded=false;S.airT=0;S.spinAcc=S.flipAcc=0;S.railCd=.5;S.gSteer=true;
  S.vx=r.dx*S.rdir*S.rs;S.vy=r.dy*S.rdir*S.rs+(popUp?4.8:0);S.vz=r.dz*S.rdir*S.rs;
  if(r.kind==='coping'){ // dal coping si esce verso il lato piu' basso (dentro la bowl / giu' dal quarter)
    const px=-r.dz,pz=r.dx,e=1.8,hA=W.H(S.x+px*e,S.z+pz*e),hB=W.H(S.x-px*e,S.z-pz*e),sg=hA<hB?1:-1;
    S.vx=S.vx*.55+px*sg*3.4;S.vz=S.vz*.55+pz*sg*3.4;S.vy=Math.max(S.vy,popUp?4.6:1.2);
  }

}

function airStep(S,inp,dt,ev){
  const V=S.V;
  S.airT+=dt;S.vy-=G*dt;
  if(S.gSteer&&!S.vert&&!V.noCrash&&Math.abs(inp.steer)>.1){ // sterzata in aria (solo dopo aver lasciato un grind/wall ride): curva la traiettoria (utile per rientrare nella bowl dal coping)
    const hs2=Math.hypot(S.vx,S.vz);if(hs2>1.5){const h=Math.atan2(S.vx,S.vz)-inp.steer*1.9*dt;S.vx=Math.sin(h)*hs2;S.vz=Math.cos(h)*hs2;S.assistT=0;S.rp=.35;}
  }
  if(S.vert){ // ritorno alla transizione: controllore smorzato verso il punto di stacco
    const ex=S.vert.tx-S.x,ez=S.vert.tz-S.z;S.vx+=(ex*9-S.vx*4.2)*dt;S.vz+=(ez*9-S.vz*4.2)*dt;S.assistT=0;
  }else if(inp.thr&&!V.noCrash){ // controllo in aria: gas = piu' lungo, freno = piu' corto
    const hs1=Math.hypot(S.vx,S.vz)||1,a=(inp.thr>0?5.5:-8)*Math.abs(inp.thr)*dt,fx=S.vx/hs1,fz=S.vz/hs1;
    if(hs1+a>2||inp.thr>0){S.vx+=fx*a;S.vz+=fz*a;}S.assistT=0;S.rp=.3;
  }else{
    S.rp=(S.rp||0)-dt;if(S.rp<=0&&S.airT>.06&&S.vy<4){S.rp=.12;const t0=S.tr;planAssist(S);}
    if(S.assistT>0){const k=Math.exp(S.assist*dt);S.vx*=k;S.vz*=k;S.assistT-=dt;}
  }
  {const hs0=Math.hypot(S.vx,S.vz),cap=V.vmax*1.08+3;if(hs0>cap){const k=Math.exp(-(hs0-cap)*.35*dt);S.vx*=k;S.vz*=k;}}
  if(!S.tkE&&S.airT>.14){S.tkE=true;ev.push({k:'takeoff'});}
  const px=S.x,py=S.y,pz=S.z;
  S.x+=S.vx*dt;S.y+=S.vy*dt;S.z+=S.vz*dt;if(S.y>S.pkY)S.pkY=S.y;{const gg=S.y-W.H(S.x,S.z);if(gg>S.pkG)S.pkG=gg;}
  S.wheel+=Math.hypot(S.vx,S.vz)*dt/V.R*.3;
  const sIn=-inp.steer,fIn=inp.flip||0;
  S.spinRate+=(sIn*V.spin-S.spinRate)*Math.min(1,dt*(sIn?10:6));
  S.flipRate+=(fIn*V.flip-S.flipRate)*Math.min(1,dt*(fIn?10:6));
  const AR=S.tr&&S.tr.rot;
  if(AR==='y'){S.yaw+=S.tr.dir*(S.tr.turns||1)*TAU*dt/S.tr.dur;}
  else if(sIn){S.yaw+=S.spinRate*dt;S.spinAcc+=S.spinRate*dt;}
  else{
    const hs=Math.hypot(S.vx,S.vz),ref=hs>1?Math.atan2(S.vx,S.vz):S.yaw;
    const err=wrapPI(S.yaw-ref),tgt=Math.round(err/Math.PI)*Math.PI,d=(tgt-err)*Math.min(1,dt*3.2);
    S.yaw+=d;S.spinAcc+=d;S.spinRate*=.9;
  }
  if(AR==='p'){S.pitch+=S.tr.dir*TAU*dt/S.tr.dur;}
  else if(fIn){S.pitch+=S.flipRate*dt;S.flipAcc+=S.flipRate*dt;}
  else{
    const tgt=predictPitch(S),d=wrapPI(tgt-S.pitch)*Math.min(1,dt*3.4);

  }
  S.roll*=.95;
  if(inp.trick>=0&&!S.tr&&V.tricks[inp.trick]&&S.airT>.04){
    const T=V.tricks[inp.trick];S.tr={id:T.id,name:T.name,dur:T.dur,pts:T.pts,t:0,ix:inp.trick,hold:!!HOLD[T.id],rot:T.id==='dcd'?T.rot:0,dir:T.dir,turns:T.turns};
  }
  if(S.tr){
    if(S.tr.hold&&inp.hold===S.tr.ix&&S.tr.t>=S.tr.dur*.5-dt){S.tr.t=S.tr.dur*.5;S.pend+=70*dt;S.tr.hT=(S.tr.hT||0)+dt;} // trick tenibile: resta in posa finche' il tasto e' premuto
    else S.tr.t+=dt;
    if(S.tr.t>=S.tr.dur)completeTrick(S,ev);

function groundStep(S,inp,dt,ev){
  const V=S.V,M=S.M,n=gn(S.x,S.z,S.vx,S.vz);
  const yawRate0=V.turn*(1+M.turnAdd);
  let sp=Math.hypot(S.vx,S.vy,S.vz);
  // salto con carica
  if(inp.jump&&!V.nojump){S.charge=Math.min(.38,S.charge+dt);}
  if(S.charge>0&&(!inp.jump||S.charge>=.38)){
    const pop=(V.pop+S.charge*5.5)*1.12,ux=n[0]*.35,uy=.65+n[1]*.35,uz=n[2]*.35,l=Math.hypot(ux,uy,uz);
    S.vx+=ux/l*pop;S.vy+=uy/l*pop;S.vz+=uz/l*pop;S.charge=0;S.manual=false;
    takeoff(S,ev);S.pitch=slopePitch(S.x,S.z,S.yaw);ev.push({k:'pop'});return;
  }
  // sterzo
  const fwdv=S.vx*Math.sin(S.yaw)+S.vz*Math.cos(S.yaw);
  const ss=Math.abs(fwdv);
  S.yaw-=inp.steer*yawRate0*clamp(ss/2.2,0,1)/(1+ss/13)*dt*(fwdv<-.5?-1:1);
  const fx=Math.sin(S.yaw),fz=Math.cos(S.yaw);
  let tx=fx-n[0]*(fx*n[0]+fz*n[2]),ty=-n[1]*(fx*n[0]+fz*n[2]),tz=fz-n[2]*(fx*n[0]+fz*n[2]);
  const tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
  let s=S.vx*tx+S.vy*ty+S.vz*tz;
  let lx=S.vx-tx*s,ly=S.vy-ty*s,lz=S.vz-tz*s;
  const vn=lx*n[0]+ly*n[1]+lz*n[2];lx-=n[0]*vn;ly-=n[1]*vn;lz-=n[2]*vn;
  const gr=Math.exp(-7.5*M.grip*env.grip*dt);lx*=gr;ly*=gr;lz*=gr;
  // motore
  const turbo=!!(V.turbo&&(inp.pump||inp.flip<-.5)&&S.battery>1&&inp.thr>0);S.turbo=turbo;
  if(V.turbo)S.battery=turbo?Math.max(0,S.battery-28*dt/M.batt):Math.min(100,S.battery+7*dt);
  const vmax=V.vmax*M.vmax*(turbo?1.38:1);

  s-=Math.sign(s)*(.3*M.roll*glideK(S,V)+.0035*s*s)*dt;
  // pump
  const hd=Math.hypot(S.vx,S.vz);
  let kap=0;
  if(hd>1){const ux=S.vx/hd,uz=S.vz/hd,d=1.3;kap=(W.H(S.x+ux*d,S.z+uz*d)-2*S.y+W.H(S.x-ux*d,S.z-uz*d))/(d*d);}
  const pumping=inp.pump||inp.flip<-.5;
  if(pumping&&!V.turbo&&s>1.5){
    const pk=V.accel*1.6;
    if(kap>.02)s+=pk*Math.min(1,kap/.12)*dt*(s<vmax*1.4?1:0);
    else if(kap<-.02)s-=pk*.7*Math.min(1,-kap/.12)*dt;
  }
  // manual
  const wasM=S.manual;
  const wantM=!!((inp.manual||inp.flip>.5)&&V.manual&&s>(V.whMotor?.8:2.5));
  S.manual=wantM&&(!V.whMotor||inp.thr>0||s>5);
  if(S.manual){S.manualT+=dt;S.pend+=0;}
  else if(wasM){if(S.manualT>.8){addCombo(S,V.whName||'Manual',Math.round(S.manualT*90*(V.whMotor?1.3:1)));bank(S,ev);}S.manualT=0;}
  // ricomponi velocita'
  const fx2=Math.sin(S.yaw),fz2=Math.cos(S.yaw);
  let ax=fx2-n[0]*(fx2*n[0]+fz2*n[2]),ay=-n[1]*(fx2*n[0]+fz2*n[2]),az=fz2-n[2]*(fx2*n[0]+fz2*n[2]);
  const al=Math.hypot(ax,ay,az)||1;ax/=al;ay/=al;az/=al;

  // decollo: il terreno scende sotto la traiettoria balistica
  const vt=Math.hypot(vx,vy,vz),pumpAbs=(inp.pump||inp.flip<-.5)&&!V.turbo;
  if(vt>2.5&&S.charge<=0){
    const tl=dt*2.5,bx=S.x+vx*tl,bz=S.z+vz*tl,by=S.y+vy*tl-.5*G*tl*tl;
    if(W.H(bx,bz)<by-(pumpAbs?.02:.0009)){S.vx=vx;S.vy=vy;S.vz=vz;takeoff(S,ev);S.pitch=slopePitch(S.x,S.z,S.yaw);airStep(S,inp,dt,ev);return;}
  }

  vx-=n2[0]*vn2;vy-=n2[1]*vn2;vz-=n2[2]*vn2;

  S.wheel+=s*dt/V.R*.3;

function railStep(S,inp,dt,ev){
  const r=S.rail,hd=Math.atan2(r.bx-r.ax,r.bz-r.az);
  const cp=r.kind==='coping';
  S.rs=Math.max(cp?1.5:2.5,S.rs-(cp?1.4:.7)*dt);
  S.rt+=S.rdir*S.rs*dt/r.len;
  if(cp&&(S.rt<0||S.rt>1)){ // il coping prosegue sul segmento successivo (curve delle bowl)
    const P=S.rt>1?[r.bx,r.bz]:[r.ax,r.az],mx=r.dx*S.rdir,mz=r.dz*S.rdir;let best=null;
    for(const r2 of W.rails){if(r2===r||r2.kind!=='coping'||r2.zone!==r.zone)continue;
      if(Math.hypot(r2.ax-P[0],r2.az-P[1])<.4&&r2.dx*mx+r2.dz*mz>.3){best={r:r2,rd:1,rt:.02};break;}
      if(Math.hypot(r2.bx-P[0],r2.bz-P[1])<.4&&-(r2.dx*mx+r2.dz*mz)>.3){best={r:r2,rd:-1,rt:.98};break;}}
    if(best&&S.rs>2.3){S.rail=best.r;S.rdir=best.rd;S.rt=best.rt;return;}
  }
  if(cp&&S.rs<2.2){endGrind(S,ev,false);return;}
  const t=clamp(S.rt,0,1);
  S.x=r.ax+(r.bx-r.ax)*t;S.z=r.az+(r.bz-r.az)*t;S.y=r.ay+(r.by-r.ay)*t;
  S.vx=r.dx*S.rdir*S.rs;S.vy=r.dy*S.rdir*S.rs;S.vz=r.dz*S.rdir*S.rs;
  const ty=S.rdir>0?hd:hd+Math.PI;S.yaw+=wrapPI(ty-S.yaw)*Math.min(1,dt*14);
  S.pitch+=(Math.atan2(r.dy,Math.hypot(r.dx,r.dz))*S.rdir-S.pitch)*Math.min(1,dt*10);
  S.pend+=100*dt;S.wheel+=dt*10;S.gT+=dt;
  if(inp.jump){S.charge=0;endGrind(S,ev,true);return;}
  if(S.rt<0||S.rt>1)endGrind(S,ev,false);
}


/* ---------- WALL RIDE ---------- */

const MP=(function(){

const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';

    if(q.get('pkey'))c.key=q.get('pkey');}catch(e){}

function Signal(id,conf,on){
  const token=Math.random().toString(36).slice(2);
  const url=(conf.secure?'wss':'ws')+'://'+conf.host+':'+conf.port+conf.path+'peerjs?key='+conf.key+'&id='+id+'&token='+token;
  let ws=null,hb=0,closed=false,openT=0,opened=false;
  try{ws=new WebSocket(url);}catch(e){setTimeout(()=>on.error('sig',String(e&&e.message||e)),0);return{send(){},close(){}};}
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='OPEN'){opened=true;clearTimeout(openT);on.open();hb=setInterval(()=>{try{ws.send(JSON.stringify({type:'HEARTBEAT'}));}catch(e){}},5000);}
    else if(m.type==='ID-TAKEN')on.error('id','ID-TAKEN');
    else if(m.type==='ERROR')on.error('sig',(m.payload&&m.payload.msg)||'');

  openT=setTimeout(()=>{if(!opened&&!closed)on.error('sig','timeout');},10000);

}
/* ---------- collegamento WebRTC ---------- */
function makeLink(sig,remoteId,cid,initiator,hooks){
  const pc=new RTCPeerConnection({iceServers:ICE});
  let dc=null,pend=[],haveRemote=false,done=false;
  const L={rx:now(),id:remoteId};
  const finish=()=>{if(!done){done=true;hooks.close();}};
  const flush=()=>{for(const c of pend)pc.addIceCandidate(c).catch(()=>{});pend=[];};
  pc.onicecandidate=e=>{if(e.candidate)sig.send({type:'CANDIDATE',dst:remoteId,payload:{candidate:e.candidate.toJSON?e.candidate.toJSON():e.candidate,type:'data',connectionId:cid}});};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')finish();};
  const wire=ch=>{dc=ch;ch.onopen=()=>hooks.open();ch.onmessage=ev=>{L.rx=now();hooks.msg(ev.data);};ch.onclose=finish;};
  if(initiator){
    wire(pc.createDataChannel('rl',{ordered:true}));
    pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig.send({type:'OFFER',dst:remoteId,payload:{sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},type:'data',connectionId:cid,label:'rl',reliable:true,serialization:'json',browser:'chrome'}})).catch(finish);
  }else pc.ondatachannel=e=>wire(e.channel);

    else if(m.type==='CANDIDATE'){const c=m.payload.candidate;if(haveRemote)pc.addIceCandidate(c).catch(()=>{});else pend.push(c);}
  };

    pc.setRemoteDescription(offer.payload.sdp).then(()=>{haveRemote=true;flush();return pc.createAnswer();}).then(a=>pc.setLocalDescription(a))

  };

  L.close=()=>{done=true;try{pc.close();}catch(e){}};
  return L;
}

  if(loc.indexOf('car:')===0){const c=Prof.M().cars[loc.slice(4)];return c?'Baule: '+Cat.CARS[c.model].name:'Baule';}
  const id=loc.slice(3),si=Prof.storageInfo(id);return si?si.name:'Deposito';
}
function vehCard(it,sel,extra){
  const mm=Cat.MODELS[it.model],b=el('button','mcard');b.type='button';b.setAttribute('aria-pressed',!!sel);
  b.innerHTML='<div class="t"><span>'+mm.name+'</span><span class="p own">'+Cat.CLS[mm.cls].name+'</span></div>'+(extra||'');
  return b;
}
function modelCard(model,sel,own){
  const mm=Cat.MODELS[model],b=el('button','mcard');b.type='button';b.setAttribute('aria-pressed',!!sel);
  const p=Prof.price(mm.price);
  b.innerHTML='<div class="t"><span>'+mm.name+'</span><span class="p'+(own?' own':'')+'">'+(own?'Posseduto':(Prof.free()||mm.price===0?'Gratis':'$ '+$$(p)))+'</span></div><div class="d">'+mm.desc+'</div>';
  b.appendChild(statBars(model,Cat.defaultCfg(model)));
  return b;
}

function tabVeh(b){
  const M=Prof.M(),inGame=H.inGame();
  b.appendChild(el('h2',null,Prof.free()?'Scegli il mezzo':'I tuoi mezzi'));
  if(Prof.free()){
    const ch=el('div','chips');
    for(const c of Cat.CLS_ORDER){const x=btn(Cat.CLS[c].name,null,()=>{st.cls=c;garage();});x.setAttribute('aria-pressed',st.cls===c);ch.appendChild(x);}
    b.appendChild(ch);
    const act=Prof.active();
    for(const id of Cat.modelsOf(st.cls)){
      const c=modelCard(id,act&&act.model===id,false);c.onclick=()=>{Prof.takeFree(id);say('');garage();};b.appendChild(c);}
    b.appendChild(photoRow());
    return;
  }
  const near=H.nearStorageId();
  const items=Object.values(M.inv).sort((a,b)=>(a.loc==='hand'?-1:0)-(b.loc==='hand'?-1:0));
  for(const it of items){
    const mm=Cat.MODELS[it.model],can=it.loc==='hand'||(!inGame&&it.loc.indexOf('car:')!==0)||(inGame&&near&&it.loc==='st:'+near);
    const c=vehCard(it,it.loc==='hand','<div class="loc">'+locName(it.loc)+(can||it.loc==='hand'?'':' · non disponibile qui')+'</div>');

    c.onclick=()=>{if(it.loc==='hand')return;if(!can){say('Vai a '+locName(it.loc)+' per prenderlo.',true);garage();return;}

    b.appendChild(c);

/* ---------- negozi ---------- */
function shop(poi){
  const m=root();m.appendChild(brand(poi.name));m.appendChild(bank());
  const sec=el('section');sec.innerHTML='<h2>'+poi.name+'</h2>';
  const cats=poi.cats;
  if(cats.length>1){const ch=el('div','chips');for(const c of cats){const x=btn(Cat.CLS[c].name,null,()=>{st.shopCls=c;st.shopSel=null;shop(poi);});x.setAttribute('aria-pressed',(st.shopCls||cats[0])===c);ch.appendChild(x);}sec.appendChild(ch);}
  const cls=cats.indexOf(st.shopCls)>=0?st.shopCls:cats[0];st.shopCls=cls;
  const ids=Cat.modelsOf(cls);if(ids.indexOf(st.shopSel)<0)st.shopSel=ids[0];
  const owned=model=>Object.values(Prof.M().inv).some(i=>i.model===model);
  for(const id of ids){const c=modelCard(id,st.shopSel===id,owned(id)&&!Prof.free());c.onclick=()=>{st.shopSel=id;shop(poi);};sec.appendChild(c);}
  const mm=Cat.MODELS[st.shopSel],row=el('div','btnrow'),p=Prof.price(mm.price);
  const b=btn(Prof.free()?'Prendi':'Compra $ '+$$(p),'pbtn hot',()=>{
    if(Prof.free()){Prof.takeFree(st.shopSel);say(mm.name+' pronta!');shop(poi);H.afterChange();return;}
    const r=Prof.buyVehicle(st.shopSel);say(r.msg,!r.ok);shop(poi);if(r.ok)H.afterChange();});
  row.appendChild(b);row.appendChild(btn('Esci','pbtn sec',()=>H.closePanel()));sec.appendChild(row);sec.appendChild(msgLine());
  m.appendChild(sec);
  H.setPreview({cls,model:st.shopSel,cfg:Object.assign(Cat.defaultCfg(st.shopSel),{model:st.shopSel})});restoreScroll();
}
function dealer(poi){
  const m=root();m.appendChild(brand(poi.name));m.appendChild(bank());
  const sec=el('section');sec.innerHTML='<h2>Auto</h2>';
  const ids=Object.keys(Cat.CARS);if(ids.indexOf(st.carSel)<0)st.carSel=ids[0];

    x.innerHTML='<div class="t"><span>'+c.name+'</span><span class="p">'+(Prof.free()?'Gratis':'$ '+$$(c.price))+'</span></div><div class="d">'+c.desc+'</div>';x.onclick=()=>{st.carSel=id;dealer(poi);};sec.appendChild(x);}
  const c=Cat.CARS[st.carSel],row=el('div','btnrow');
  row.appendChild(btn(Prof.free()?'Prendi':'Compra $ '+$$(Prof.price(c.price)),'pbtn hot',()=>{const lot=World.carLots.find(l=>l.id===poi.id);const r=Prof.buyCar(st.carSel,lot);say(r.msg,!r.ok);dealer(poi);if(r.ok)H.afterChange();}));

function property(poi){
  const own=Prof.owns(poi.id);
  if(own||poi.home)return storage(poi.id,poi);
  const info=poi.type==='house'?Cat.HOUSES[poi.htype]:Cat.GARAGES[poi.gtype];
  const m=root();m.appendChild(brand(info.name));m.appendChild(bank());
  const sec=el('section');sec.innerHTML='<h2>'+info.name+'</h2><div class="d" style="color:var(--mute)">'+info.desc+'</div><p>Capienza: <b>'+info.cap+' mezzi</b></p><p>Prezzo: <b>'+(Prof.free()?'Gratis':'$ '+$$(info.price))+'</b></p>';
  const row=el('div','btnrow');
  row.appendChild(btn(Prof.free()?'Prendi':'Compra','pbtn hot',()=>{const r=Prof.buyProp(poi.id);say(r.msg,!r.ok);if(r.ok){H.afterChange();storage(poi.id,poi);}else property(poi);}));
  row.appendChild(btn('Esci','pbtn sec',()=>H.closePanel()));sec.appendChild(row);
  if(MP.on){const ow=MP.ownersOf(poi.id);if(ow.length){sec.appendChild(el('h2',null,'Visita'));
    for(const p of ow){const lk=(p.props.locks&&p.props.locks[poi.id]);const lt=lk===0?'aperta':lk===2?'chiusa':'su invito';
      sec.appendChild(btn('Entra da '+p.name+' · '+lt,'pbtn sec',()=>H.visit(p,poi)));}}}
  sec.appendChild(msgLine());m.appendChild(sec);
  H.setPreview(null);restoreScroll();
}

const KEY='rl4-social';
let D={handle:'',posts:[],ms:{},liked:{}};
try{const s=localStorage.getItem(KEY);if(s)D=Object.assign(D,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
const NAMES=['marco_bmx','giu.scoot','tk_rider','bruno.dh','sofi_wheels','olmi_crew','nico.flip','ale_dirt','baggio.jam','lory.ride','dani_pump','miki_tk','vale.park','rocco.mtb'];

const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const rng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
let notes=[];
function note(pts){notes.push([performance.now(),pts]);if(notes.length>40)notes.shift();}
function recent(sec){const n=performance.now()-sec*1000;let s=0;for(const q of notes)if(q[0]>n)s+=q[1];return s;}
/* engagement simulato: cresce nel tempo reale dopo la pubblicazione */
function eng(p,now){
  const R=rng(hash(p.id)),f=followers(now,true),base=(20+p.q*.05)*(p.gp?1.3:1)*(.7+R()*.8)*(1+f/500);
  const k=1-Math.exp(-(now-p.t)/45000);
  return{likes:Math.floor(base*k*(1+f/300)),target:base,coms:Math.floor(base*k/14),k};
}
function followers(now,raw){
  let s=0;for(const p of D.posts){const R=rng(hash(p.id)),b=(20+p.q*.05)*(p.gp?1.3:1)*(.7+R()*.8),k=1-Math.exp(-(now-p.t)/45000);s+=b*k;}
  return Math.floor(s*.16);
}

function tick(dt){
  chk-=dt;if(chk>0)return;chk=2;const f=followers(Date.now());
  for(const m of MS){if(f>=m[0]&&!D.ms[m[0]]){D.ms[m[0]]=1;save();H.toast(m[1]);H.reward(m[2],m[3]);}}

}

function act(a){

  if(a.startsWith('go:')){tab=a.slice(3);return render();}
  if(a.startsWith('shot:'))return shot(+a.slice(5));
  if(a==='mk'){const v=(root.querySelector('#hnd').value||'').trim().toLowerCase();if(!/^[a-z0-9_.]{3,16}$/.test(v)){root.querySelector('#herr').textContent='Da 3 a 16 caratteri: lettere, numeri, _ e .';return;}D.handle=v;save();return render();}
  if(a==='pub'){if(!D.handle){tab='social';return render();}const cp=(root.querySelector('#pcap').value||'').trim()||prev.cap;
    D.posts.push({id:'p'+Date.now(),t:Date.now(),cap:cp,place:prev.place,frames:prev.frames,q:prev.q,gp:prev.gp,cls:prev.cls});
    while(D.posts.length>8)D.posts.shift();save();H.toast('Pubblicato su Ruotagram!');tab='social';return render();}
  if(a.startsWith('view:')){sel=a.slice(5);tab='view';return render();}
  if(a==='del'){D.posts=D.posts.filter(p=>p.id!==sel);save();sel=null;tab='social';return render();}
  if(a.startsWith('lk:')){const id=a.slice(3);D.liked[id]=!D.liked[id];save();return render();}
  if(a.startsWith('gp:')){H.setGopro(a.slice(3)==='off'?null:a.slice(3));return render();}
  if(a.startsWith('est:')){close();H.startEvent(a.slice(4));return;}
  if(a==='ecan'){H.cancelEvent();return render();}
}

let proj=null,vp=null,eye=[0,5,-6];
function snapCam(){const S=G.S;cam.yaw=S.yaw;cam.off=0;cam.x=S.x-Math.sin(S.yaw)*5.6;cam.z=S.z-Math.cos(S.yaw)*5.6;cam.y=S.y+2.4;}
let gopro=null;
const camMode=()=>(G&&G.S&&G.S.mode!=='crash'&&(gopro||Prof.P.settings.cam==='1p'))?'1p':'3p';
const FPH={ski:1.55,surf:1.5,bmx:1.5,scooter:1.6,ebike:1.55,escooter:1.58,dirt:1.58,downhill:1.55,car:1.25};
const fpc={yaw:0,init:false};
function updCamFP(dt){
  const S=G.S,k=Math.min(1,dt*9),car=G.cls==='car';
  if(!fpc.init){fpc.yaw=S.yaw;fpc.init=true;}
  fpc.yaw+=wrap(S.yaw-fpc.yaw)*k;
  if(!cam.dragging)cam.off*=Math.pow(.25,dt);
  const yaw=fpc.yaw+cam.off;let hh=(FPH[G.cls]||1.5)*(1-.07*(S.crouch||0)),fw=car?.05:-.12;
  if(gopro==='bike'){hh=.62;fw=.8;}else if(gopro==='helmet'){hh*=1.03;}
  eye=[S.x+Math.sin(S.yaw)*fw,S.y+hh,S.z+Math.cos(S.yaw)*fw];
  const pit=clamp(wrap(S.pitch)*.55-.1,-.9,.9),cp=Math.cos(pit),sp=Math.sin(pit);
  const tgt=[eye[0]+Math.sin(yaw)*cp*10,eye[1]+sp*10,eye[2]+Math.cos(yaw)*cp*10];
  const rl=clamp(wrap(S.roll)*.5,-.5,.5),up=[Math.sin(yaw+Math.PI/2)*Math.sin(rl)*.0+Math.sin(rl)*Math.cos(yaw),Math.cos(rl),-Math.sin(rl)*Math.sin(yaw)];
  const hs=Math.hypot(S.vx,S.vz);cam.fov+=(((gopro?(gopro==='bike'?96:102):80)+Math.min(hs,22)*.6)-cam.fov)*Math.min(1,dt*3);
  return M4.lookAt(eye,tgt,up);
}
function updCam(dt){
  if(camMode()==='1p')return updCamFP(dt);
  fpc.init=false;
  const S=G.S,hs=Math.hypot(S.vx,S.vz),car=G.cls==='car';
  const ty=(hs>2.5&&!S.rail)?Math.atan2(S.vx,S.vz):S.yaw;
  cam.yaw+=wrap(ty-cam.yaw)*Math.min(1,dt*(S.grounded?3.4:1.8));
  if(!cam.dragging)cam.off*=Math.pow(.25,dt);
  const yaw=cam.yaw+cam.off,dist=(car?8:5.4)+Math.min(hs,car?24:16)*.07,h=(car?3:2.1)+(S.grounded?0:.35);
  const k=Math.min(1,dt*7);
  cam.x+=(S.x-Math.sin(yaw)*dist-cam.x)*k;cam.z+=(S.z-Math.cos(yaw)*dist-cam.z)*k;
  cam.y+=(S.y+h-cam.y)*Math.min(1,dt*4.5);
  const gh=W.H(cam.x,cam.z)+1;if(cam.y<gh)cam.y=gh;
  cam.fov+=((60+Math.min(hs,22)*.9)-cam.fov)*Math.min(1,dt*3);
  eye=[cam.x,cam.y,cam.z];
  const tx=S.x+Math.sin(yaw)*2,tz=S.z+Math.cos(yaw)*2;
  return M4.lookAt(eye,[tx,S.y+1.2,tz],[0,1,0]);
}

    const lv=qualLevel;if(avg>.028&&lv==='high')qualLevel='med';else if(avg>.034&&lv==='med')qualLevel='low';if(lv!==qualLevel)applyQuality();}}
  Env.update(dt,G&&G.S?G.S.y:0);
  MP.update(dt);if(MP.on&&G&&G.S)MP.tick(dt,mpSnap);
  const li=Env.light();
  if(Env.takeThunder())Snd.thunder();
  if(mode==='play'&&G&&!(paused&&!dlgOpen&&false)){
    const S=G.S;
    if(!paused&&!REP){
      G.dt=dt;acc+=dt;trickT-=dt;if(trickT<=0)trickReq=-1;
      const ev=[],H=1/120;let n=0;
      while(acc>=H&&n<8){prevS=snapS(S);const inp=readInput();P.step(S,inp,H,ev);acc-=H;n++;}
      if(acc>H*8)acc=0;
      if(S.mode==='ride'){
        if(S.rail&&Math.random()<.8)emit(S.x,S.y+.05,S.z,2,[1,.8,.3],3,1.4,.12,.4);
        else if(S.grounded&&S.speed>6&&Math.random()<.25)emit(S.x,S.y+.05,S.z,1,Env.st.snowG>.5?[.95,.97,1]:[.78,.7,.55],.8,.6,.2,.5);
      }
      updParts(dt);onEvents(ev,S);
      NPC.updRiders(dt,S);NPC.updPeds(dt,S);evTick(dt,S);Phone.tick(dt);airportTick();
      tickT+=dt;if(tickT>.25){tickT=0;quest({k:'tick'},S);}
      saveT+=dt;if(saveT>6){saveT=0;savePos();Prof.save();}
      if(!IN&&!FOOT)recTick(S,dt);
    }
    if(REP){frameReplay(dt,li,asp);return;}
    if(IN){frameIndoor(dt,li,asp);return;}
    if(FOOT){frameFoot(dt,li,asp);return;}
    if(!paused)lerpApply(S,acc/(1/120));
    const view=updCam(dt);proj=M4.persp(cam.fov*Math.PI/180,asp,camMode()==='1p'?.1:.3,1500);vp=M4.mul(proj,view);
    const sc=cv.height/(2*Math.tan(cam.fov*Math.PI/360));
    Render.frame({light:li,view,proj,eye,tanY:Math.tan(cam.fov*Math.PI/360),focus:[S.x,S.y,S.z],objects:p=>drawObjects(p,S,[S.x,S.y,S.z]),
      extra:()=>{if(EV&&EV.meshes&&EV.cd<=0&&EV.cps[EV.i])GL3.draw(EV.meshes[EV.i],M4.id(),[1,1,1],true,.38);},
      precip:Env.precip(eye,dt),spot:headSpot(S,li),particles:(v,s)=>GL3.points(parts.a,parts.n,v,s)});
    Phone.setGoproUI(!!gopro);Park.show(!!W.zoneAt(S.x,S.z)&&W.zoneAt(S.x,S.z).id==='build');
    const act=nearestAct();G.act=act;
    updHUD(S,act);drawMini(S);updTags(S);updMpTags(S);mpTickHUD(dt);nextReq();
    $('#bCam').textContent=camMode()==='1p'?'3a':'1a';
    Snd.update({cls:G.cls,speed:S.speed,vmax:S.V.vmax,motor:!!S.V.motor,thr:lastThr,grounded:S.grounded,rainF:Env.st.rainF,driving:!!G.car});
    lerpRestore(S);
  }else if(mode==='menu'||mode==='load'||mode==='title'){
    tmenu+=dt;
    if(!pv)previewFromState();
    const wide=innerWidth>720,mw=Math.round(Math.min(430,innerWidth)*dprR);
    const vpr=wide?[mw,0,cv.width-mw,cv.height]:[0,Math.round(cv.height*.4),cv.width,Math.round(cv.height*.6)];
    const a2=vpr[2]/vpr[3],ang=tmenu*.5,Rr=wide?(pv.cls==='car'?7.4:4.4):(pv.cls==='car'?8.4:5.4),ox=0,oz=-20;
    const gy=W.H(ox,oz),e=[ox+Math.sin(ang)*Rr,gy+1.8,oz+Math.cos(ang)*Rr],view=M4.lookAt(e,[ox,gy+.85,oz],[0,1,0]);
    const fov=45*Math.PI/180,pr=M4.persp(fov,a2,.2,600);
    const S={vid:pv.cls,x:ox,y:gy,z:oz,yaw:0,pitch:0,roll:0,wheel:tmenu*3,crouch:.15,tr:null,mode:'ride',grounded:true,manual:false,t:tmenu,turbo:false};
    Render.frame({light:li,view,proj:pr,eye:e,tanY:Math.tan(fov/2),viewport:vpr,focus:[ox,gy,oz],noBeacons:true,pois:false,
      objects:p=>{if(p==='main')Veh.shadow(S,gy);Veh.draw(S,pv.cfg,{char:charOf(),driver:true});}});
    hideTags();Snd.update(null);
    if(G&&G.S){const S2=G.S;vp=null;}
  }
}
function showErr(t,m){$('#ovT').textContent=t;$('#ovM').textContent=m;$('#ov').classList.add('on');$('#loading').style.display='none';}
function boot(){
  cv=$('#c');
  try{Prof.load();Photo.init();Models.init();Models.setHooks({pos:()=>G&&G.S?{x:G.S.x,z:G.S.z,yaw:G.S.yaw}:null,resume:()=>{if(mode==='menu'&&G)resume();}});GL3.init(cv,{shadow:2048});Veh.init();Render.init(cv,{shadow:2048,sh:true});}catch(e){showErr('Grafica non disponibile',String(e.message||e)+'. Serve un browser con WebGL2.');return;}
  UI.init({toast,inGame:()=>!!G,begin,resume,go:()=>startAt(sel.spot),toTitle,setPreviewFromState:previewFromState,setPreview,closePanel,afterChange,
    openGarage:()=>{UI.st.panel=false;previewFromState();UI.garage('veh');},nearStorageId,enterCar,leaveCar,applySettings,sel,zoneDesc:ZD,
    syncProps,syncVeh:()=>syncVeh(true),visit:visitReq,visitCancel:()=>{pendingV=null;},giftSend,mpCreate,mpJoin,mpLeft});
  mpHooks();
  Phone.init(phoneHooks());
  Park.init(parkHooks());
  {const b=document.createElement('button');b.className='ib';b.id='bFoot';b.type='button';b.textContent='🚶';b.style.fontSize='16px';b.setAttribute('aria-label','Scendi/sali (G)');const bp=document.getElementById('bPhone');bp.parentNode.insertBefore(b,bp);b.onclick=toggleFoot;}
  applySettings();
  scene=null;const sb=Scene.build();let i=0;
  const step=()=>{
    const t0=performance.now();
    try{while(i<sb.jobs.length&&performance.now()-t0<30){sb.run(sb.jobs[i++]);}}catch(e){showErr('Errore',String(e.stack||e));return;}
    $('#lbar').style.width=(i/sb.jobs.length*90)+'%';
    if(i<sb.jobs.length){setTimeout(step,0);return;}
    setTimeout(()=>{try{scene=sb.finish();scene.chunks=sb.out.chunks;scene.pchunks=sb.out.pchunks;Render.setScene(scene);NPC.buildPeds();NPC.buildRiders();}catch(e){showErr('Errore',String(e.stack||e));return;}
      $('#lbar').style.width='100%';$('#loading').style.display='none';
      mode='menu';previewFromState();openMenuMode();UI.title();last=performance.now();requestAnimationFrame(loop);},0);
  };
  step();
}
$('#bMenu').onclick=()=>{if(mode==='play'){savePos();UI.st.panel=false;openMenuMode();previewFromState();UI.garage();}};
$('#bRep').onclick=()=>{if(mode==='play')repOpen();};

document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){savePos();UI.st.panel=false;openMenuMode();previewFromState();UI.garage();}});
addEventListener('pagehide',()=>{try{if(G)savePos();Prof.save();}catch(e){}});
window.__rl={mmRun:()=>{for(let i=0;i<40000&&!(MM.cv&&MM.done);i++)mmStep();return MM.done;},enter:enterIndoor,leave:()=>leaveIndoor(),rec:()=>REC.length,recTick,travel,airport,closeBP,Park,foot:()=>FOOT,toggleFoot,Phone,evBest:()=>evBest,startEvent,W,IN:()=>IN,leave:()=>leaveIndoor(),MP,mpInfo,addChat,visitReq,giftSend,begin,startAt,state:()=>G&&G.S,G:()=>G,mode:()=>mode,keys,cam,trick:i=>{trickReq=i;trickT=.3;},interact,Prof,UI,talk,
  tp:(x,z,yaw)=>{const S=G.S;S.x=x;S.z=z;S.y=W.H(x,z)+.2;S.vx=S.vy=S.vz=0;if(yaw!=null)S.yaw=yaw;snapCam();},
  sel,act:()=>G&&G.act,peds:NPC.peds,riders:NPC.riders,toTitle,env:Env};
boot();
})();
